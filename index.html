<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic Chatbox</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/desktop.css">
</head>
<body>
<div id="app" class="app">

  <!-- Sidebar: new chat, navigation, recent conversations, you -->
  <aside id="sidebar" class="sidebar" aria-label="Sidebar">
    <div class="sb-top">
      <div class="brand">
        <span class="brand-mark" data-icon="logo" aria-hidden="true"></span>
        <span id="app-name" class="brand-name">Agentic Chatbox</span>
      </div>
      <button id="collapse-sidebar" class="ghost" style="margin-left:auto" title="Close sidebar (⌘B)" aria-label="Close sidebar" data-icon="sidebar"></button>
    </div>
    <nav class="sb-nav" aria-label="Main">
      <button id="new-chat" class="sb-item sb-new" title="New chat (⌘K)"><span class="plus" data-icon="plus"></span>New chat</button>
      <button id="nav-files" class="sb-item" title="Opens in its own window"><span data-icon="folder"></span>Projects &amp; files</button>
      <button id="nav-connectors" class="sb-item"><span data-icon="plug"></span>Connectors<span id="nav-connectors-count" class="count"></span></button>
      <button id="nav-skills" class="sb-item"><span data-icon="sparkles"></span>Skills<span id="nav-skills-count" class="count"></span></button>
      <button id="nav-models" class="sb-item"><span data-icon="cpu"></span>Models<span id="nav-models-count" class="count"></span></button>
    </nav>
    <div class="sb-section"><span>Recents</span></div>
    <div class="sb-search">
      <span data-icon="search"></span>
      <input id="chat-search" type="search" placeholder="Search chats" aria-label="Search chats">
    </div>
    <ul id="chat-list" class="chat-list" aria-label="Conversations"></ul>
    <div class="sb-bottom">
      <button id="open-settings" class="me" title="Settings">
        <span id="me-avatar" class="avatar">Y</span>
        <span class="me-text">
          <span id="me-name" class="me-name">You</span>
          <span class="me-status"><span id="status-dot" class="dot"></span><span id="status-text">Connecting…</span></span>
        </span>
      </button>
      <button id="toggle-theme" class="ghost" title="Switch light / dark" aria-label="Switch color theme" data-icon="theme"></button>
    </div>
  </aside>

  <!-- Main area -->
  <main class="main">
    <header class="topbar">
      <button id="show-sidebar" class="ghost hidden" title="Open sidebar (⌘B)" aria-label="Open sidebar" data-icon="sidebar"></button>
      <button id="chat-title" class="chat-title" title="Rename this chat">New chat</button>
      <span id="skill-badge" class="skill-badge hidden" title="Active agent skill">
        <span id="chat-skill"></span>
        <button id="clear-skill" title="Back to automatic" aria-label="Clear skill" data-icon="x"></button>
      </span>
      <div class="topbar-right">
        <button id="toggle-files" class="ghost" title="Open the Files window: explorer and editor (⌘E)"><span data-icon="folder"></span><span>Files</span></button>
        <button id="open-activity" class="ghost" title="Activity log" aria-label="Activity" data-icon="activity"></button>
      </div>
    </header>

    <div class="content">
      <section id="conversation" class="conversation empty" aria-label="Chat">
        <div id="messages" class="messages" aria-live="polite"><div id="thread" class="thread"></div></div>
        <div class="composer-wrap">
          <div id="palette" class="hidden" role="listbox"></div>
          <div id="composer" class="composer">
            <div id="composer-chips" class="chips"></div>
            <textarea id="chat-input" rows="1" placeholder="How can I help you today?" aria-label="Message"></textarea>
            <div class="composer-bar">
              <button id="plus-btn" class="cbtn" title="Add files, skills and more" aria-label="Add" data-icon="plus"></button>
              <button id="tools-btn" class="cbtn" title="Tools: connectors, skills, plan mode"><span data-icon="sliders"></span><span id="tools-badge" class="badge hidden"></span></button>
              <button id="project-btn" class="cbtn" title="The project the assistant works in and saves files to"><span data-icon="folder"></span><span id="project-label">No project</span></button>
              <button id="plan-chip" class="cbtn on hidden" title="Plan mode is on: the assistant only investigates and proposes a plan"><span data-icon="list"></span>Plan</button>
              <button id="auto-chip" class="cbtn on hidden" title="Actions inside the project run without asking"><span data-icon="bolt"></span><span id="auto-chip-text">Auto</span></button>
              <span class="spacer"></span>
              <button id="model-btn" class="model-btn" title="Choose a model"><span id="model-label">Automatic</span><span data-icon="chevron"></span></button>
              <button id="send" class="send-btn" title="Send (Enter)" aria-label="Send" data-icon="arrow-up" disabled></button>
              <button id="stop" class="send-btn stop hidden" title="Stop" aria-label="Stop" data-icon="stop"></button>
            </div>
            <input id="file-input" type="file" multiple class="hidden">
            <input id="plan-mode" type="checkbox" class="hidden" tabindex="-1" aria-hidden="true">
            <input id="auto-approve" type="checkbox" class="hidden" tabindex="-1" aria-hidden="true">
          </div>
          <p class="composer-foot">Runs on your computer. Anything that changes files or calls a connector waits for your approval.</p>
        </div>
      </section>

    </div>
  </main>
</div>

<!-- Settings -->
<dialog id="settings" class="settings" aria-label="Settings">
  <nav class="set-nav" aria-label="Settings sections">
    <h2>Settings</h2>
    <button class="set-tab" data-tab="general"><span data-icon="user"></span>General</button>
    <button class="set-tab" data-tab="models"><span data-icon="cpu"></span>Models</button>
    <button class="set-tab" data-tab="media"><span data-icon="image"></span>Media &amp; GPU</button>
    <button class="set-tab" data-tab="connectors"><span data-icon="plug"></span>Connectors<span class="count" id="tab-count-connectors"></span></button>
    <button class="set-tab" data-tab="skills"><span data-icon="sparkles"></span>Skills<span class="count" id="tab-count-skills"></span></button>
    <button class="set-tab" data-tab="permissions"><span data-icon="shield"></span>Agents &amp; permissions</button>
    <button class="set-tab" data-tab="activity"><span data-icon="activity"></span>Activity</button>
  </nav>
  <div class="set-main">
    <div class="set-head">
      <h3 id="set-title">General</h3>
      <button id="close-settings" class="ghost" aria-label="Close settings" title="Close (Esc)" data-icon="x"></button>
    </div>
    <div id="set-body" class="set-body"></div>
  </div>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
